name: Company Panel CI

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify npm production configuration gate
        run: npm run check:production-env
        env:
          # Syntax-only CI host; live deployment still needs real API domain.
          VITE_API_URL: https://api.cubegears.app/api/v1
          VITE_USE_MOCK_API: "false"
      - run: npm run build
        env:
          # Harmless build-only placeholder; deployment must supply its real API URL.
          VITE_API_URL: https://api.example.invalid/api/v1
      - run: npm run check:bundle
      # Run all committed regression tests; hardcoded obsolete file paths break CI.
      - name: Regression tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          UI_PRODUCTION: '1'
          UI_ARTIFACT_DIR: ${{ runner.temp }}/cubegears-ui-smoke
      - name: Preserve UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/cubegears-ui-smoke
          if-no-files-found: ignore
          retention-days: 7
